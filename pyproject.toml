[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconspider"
version = "0.1.0"
description = "Scoped, asynchronous attack surface inventory for authorized reconnaissance"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Scrapy>=2.14,<3", "Twisted>=24.3", "pydantic>=2,<3", "PyYAML>=6", "httpx>=0.27,<1", "tldextract>=5,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1", "shub>=2.15"]
browser = ["scrapy-playwright>=0.0.40"]

[project.scripts]
reconspider = "reconspider.cli:main"

[project.entry-points.scrapy]
settings = "reconspider.settings"

[tool.setuptools.packages.find]
include = ["reconspider*"]

[tool.ruff]
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
